<script>
const enc = new TextEncoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
// Ignore case, spaces, dashes and anything that is not a letter or digit.
const normalise = s => (s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
async function loadVault() {
  const r = await fetch("/assets/vault.json", { cache: "no-store" });
  if (!r.ok) throw new Error("vault missing");
  return r.json();
}

(async () => {
  const code = sessionStorage.getItem("pc-code");
  if (!code) return;
  try {
    const v = await loadVault();
    const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(v.kdf.salt), iterations: v.kdf.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(v.iv) }, key, b64(v.ct));
    const payload = JSON.parse(new TextDecoder().decode(plain));
    document.getElementById("locked").style.display = "none";
    const box = document.getElementById("vault");
    box.innerHTML = payload.html;
    box.style.display = "block";
    new Function(payload.js)();
  } catch (err) {
    sessionStorage.removeItem("pc-code");
    document.getElementById("lockedMsg").textContent = "That code did not open the vault. Try entering it again.";
  }
})();
</script>
